# errors.toml — the error taxonomy. Every failure the launcher can emit has a stable ID, a stable exit
# code, a one-line meaning, an exact fix, and a runbook page runbooks/<ID>.adoc (generated stubs).
# Exit codes are part of the CLI contract: never renumber; append only.
schema = 2

[[error]]
id = "E-USAGE"
title = "the command line was not understood"
exit = 2
meaning = "bad command line"
fix = "idris2x --help"
[[error]]
id = "E-PIN-NOT-FOUND"
title = "nothing is pinned for this version and target"
exit = 10
meaning = "no lock, or lock/channel has no capsule for this version+target"
fix = "idris2x pin <supported-version>"
[[error]]
id = "E-HASH-MISMATCH"
title = "capsule bytes do not match the lock"
exit = 11
meaning = "downloaded bytes or unpacked tree do not match the pinned digest"
fix = "idris2x install --locked"
[[error]]
id = "E-SIG-INVALID"
title = "channel manifest signature or key does not verify"
exit = 12
meaning = "channel manifest signature or key id does not verify"
fix = "do not override; investigate the mirror (runbook)"
[[error]]
id = "E-PLATFORM-UNSUPPORTED"
title = "no capsule exists for this kind of machine"
exit = 13
meaning = "no capsule exists for this OS/arch"
fix = "see supported targets; consider --from-source (Tier 3)"
[[error]]
id = "E-NETWORK"
title = "the download could not be completed"
exit = 14
meaning = "all mirrors failed"
fix = "retry; check proxy; IDRIS2X_OFFLINE=1 with a prefetched bundle"
[[error]]
id = "E-LOCK-TIMEOUT"
title = "another idris2x is installing the same capsule"
exit = 15
meaning = "another install of the same capsule held the lock too long"
fix = "wait for the other install, or raise IDRIS2X_LOCK_TIMEOUT; never delete a lock that is held"
[[error]]
id = "E-GLIBC-FLOOR"
title = "this system's C library is older than the capsule needs"
exit = 16
meaning = "host glibc older than the capsule's min_glibc"
fix = "upgrade the host or use a musl/static capsule when available"
[[error]]
id = "E-PROBE-CODEGEN"
title = "the installed toolchain failed a self-check on this machine"
exit = 17
meaning = "capsule unpacked and verified but a canary failed on this host"
fix = "runbook triage; idris2x doctor --json"
[[error]]
id = "E-CHANNEL-SCHEMA"
title = "a file was written for a newer idris2x"
exit = 18
meaning = "channel or lock schema newer than this launcher"
fix = "update idris2x"
[[error]]
id = "E-PIN-DRIFT"
title = "idris2x.toml and idris2x.lock disagree"
exit = 19
meaning = "idris2x.toml and idris2x.lock disagree"
fix = "idris2x pin <version>"
[[error]]
id = "E-OFFLINE"
title = "needed data is not cached and offline mode is on"
exit = 20
meaning = "cache miss while IDRIS2X_OFFLINE=1"
fix = "idris2x fetch -o bundle on a connected host, then idris2x install --from bundle"
# --- added by the Phase 0 prototype (not in the original plan) ---
[[error]]
id = "E-CAPSULE-INVALID"
title = "the capsule archive is malformed or unsafe"
exit = 21
meaning = "capsule archive is malformed or contains unsafe paths/links"
fix = "report the digest; never unpack by hand"
[[error]]
id = "E-CHANNEL-ROLLBACK"
title = "the channel offered an older manifest than one already seen"
exit = 22
meaning = "channel_version went backwards relative to the lock (rollback/freeze attack or stale mirror)"
fix = "investigate; do not override"
[[error]]
id = "E-CHANNEL-EXPIRED"
title = "the channel manifest is past its expiry time"
exit = 23
meaning = "channel manifest past its expires timestamp (freeze protection)"
fix = "fetch a fresh manifest; IDRIS2X_ALLOW_EXPIRED=1 only when you know why"
[[error]]
id = "E-STORE-IO"
title = "the store could not be written"
exit = 24
meaning = "store not writable, disk full, or atomic rename failed"
fix = "free space / fix permissions; idris2x gc"
[[error]]
id = "E-INTERNAL"
title = "idris2x has a bug"
exit = 70
meaning = "launcher bug"
fix = "file an issue with idris2x doctor --json"

# --- schema 2 (DX design, docs/dx/): occurrence shapes ---------------------------------------------------------------
# An [[error]] is a failure TYPE: id, exit, meaning, fix stay as they were, and `title` is its constant one-line summary.
# A [[case]] is one SHAPE that type takes at a call site. The launcher passes only an id, a case name and typed context
# values; every word a user reads comes from here. Fields ({name} is replaced by a context value):
#   error, case   which type this shape belongs to, and its name (unique within the type)
#   summary       terse headline: lowercase, no full stop (style B header, and --json `summary`)
#   story         the same headline as one plain sentence (style A)
#   facts         ordered `label=context-name` pairs, space separated: the values the user needs, never truncated
#   state         what is true on disk now (I2 atomic or absent, said out loud)
#   why           why this happens, in one or two sentences
#   fix_lead      optional lead-in to the command (style A only)
#   fix_cmd       the single best command to paste; empty when no command is honest
#   fix_note      what to do if the command is not enough, or instead of one
#   auto          may CI or an agent run fix_cmd unattended? safe | placeholder | none
# Both styles ship and the user chooses (owner ruling 2026-11-16): IDRIS2X_STYLE=a or b. Every id has at least one case.

[[case]]
error = "E-PIN-NOT-FOUND"
case = "no-lock"
summary = "no {lock} in {dir}"
story = "There is no {lock} in this directory, so I do not know which Idris 2 to run."
facts = "directory=dir looked-for=lock"
state = "Nothing was downloaded or changed."
why = "idris2x never guesses a version. Every run is tied to a lock file, so the same command gives the same compiler on every machine."
fix_lead = "If this is the project root, pin a version here:"
fix_cmd = "idris2x pin <version>"
fix_note = "If the project already has a lock file, change to the directory that holds it: the lock is read from the current directory only."
auto = "placeholder"
[[case]]
error = "E-PIN-NOT-FOUND"
case = "no-target"
summary = "{lock} pins no capsule for {target}"
story = "{lock} does not pin a capsule for this machine."
facts = "this-machine=target lock-covers=covered"
state = "Nothing was downloaded or changed."
why = "The lock records one capsule per platform. It was written when the channel had none for this platform."
fix_lead = "Pin again to pick up every platform the channel offers now:"
fix_cmd = "idris2x pin {version}"
fix_note = "If {target} is still missing afterwards, no capsule is published for it yet: see the supported platforms page."
auto = "safe"
[[case]]
error = "E-PIN-NOT-FOUND"
case = "no-version"
summary = "the channel has no idris2 {version}"
story = "The channel does not offer Idris 2 {version}."
facts = "asked-for=version available=available"
state = "{lock} was not changed."
why = "Only versions with a published, signed capsule can be pinned."
fix_lead = "Pin one of the available versions:"
fix_cmd = "idris2x pin <version>"
fix_note = ""
auto = "placeholder"

[[case]]
error = "E-PIN-NOT-FOUND"
case = "not-installed"
summary = "the pinned capsule is not installed"
story = "The pinned capsule is not installed yet, so there is nothing to check."
facts = "capsule=digest"
state = "Nothing was changed."
why = "verify checks a capsule that is already in the store. It does not download one."
fix_lead = "Install it first:"
fix_cmd = "idris2x install --locked"
fix_note = ""
auto = "safe"
[[case]]
error = "E-PIN-NOT-FOUND"
case = "no-idris2"
summary = "the pinned capsule holds Chez Scheme only, not Idris 2"
story = "The pinned capsule holds Chez Scheme only, so there is no Idris 2 to run."
facts = "capsule=name"
state = "Nothing was changed."
why = "Some capsules carry only Chez Scheme. They serve idris2x run, not idris2x exec."
fix_lead = ""
fix_cmd = ""
fix_note = "Pin a version of Idris 2 with idris2x pin, or use idris2x run to start Chez Scheme."
auto = "none"
[[case]]
error = "E-PIN-NOT-FOUND"
case = "no-urls"
summary = "{lock} lists no download address for this machine's capsule"
story = "{lock} names this machine's capsule and gives no address to download it from."
facts = "capsule=digest"
state = "Nothing was downloaded or changed."
why = "The lock file was edited by hand, or written by a faulty tool. A lock written by idris2x pin always lists at least one address."
fix_lead = "Write the lock again from the channel:"
fix_cmd = "idris2x pin {version}"
fix_note = ""
auto = "safe"

[[case]]
error = "E-HASH-MISMATCH"
case = "download"
summary = "downloaded capsule does not match {lock}"
story = "The capsule I downloaded is not the one {lock} pins."
facts = "expected=want got=got size=bytes from=source"
state = "Nothing was installed. The bad download was deleted and the store is unchanged."
why = "A mirror served a damaged, truncated or stale file. It can also mean tampering, which is what this check exists to catch."
fix_lead = "Try the download again:"
fix_cmd = "idris2x install --locked"
fix_note = "If it fails again with the same got digest, the mirror is serving a bad file: report it with the runbook below."
auto = "safe"
[[case]]
error = "E-HASH-MISMATCH"
case = "bundle"
summary = "bundle {source} does not match {lock}"
story = "The bundle you gave me is not the capsule {lock} pins."
facts = "expected=want got=got size=bytes bundle=source"
state = "Nothing was installed. Your bundle file was left untouched."
why = "The bundle was fetched for a different lock file, or it was damaged in transit."
fix_lead = ""
fix_cmd = "idris2x fetch -o capsule.tar.gz"
fix_note = "Run that on a connected machine with this exact {lock}, then copy the new bundle here."
auto = "none"
[[case]]
error = "E-HASH-MISMATCH"
case = "store-modified"
summary = "an installed capsule was modified after installation"
story = "An installed capsule no longer matches its own checksums."
facts = "capsule=digest store-entry=dir"
state = "The capsule was left in place so that you can inspect it."
why = "Files in the store changed after installation: by hand, by another tool, or through disk corruption. The store is meant to be read-only."
fix_lead = "Remove this capsule and install it again:"
fix_cmd = "rm -rf {dir} && idris2x install --locked"
fix_note = "Programs compiled with this capsule keep working once it is reinstalled, because the store path stays the same."
auto = "none"

[[case]]
error = "E-SIG-INVALID"
case = "bad-signature"
summary = "channel manifest signature does not verify"
story = "The channel manifest's signature does not match its contents."
facts = "manifest=url trusted-key=key"
state = "The manifest was discarded. Your lock file and store are unchanged, and everything already pinned still runs."
why = "The manifest was altered after it was signed, or a mirror served a manifest and a signature from two different publishes."
fix_lead = "Wait a minute, then try once more in case a mirror was mid-update:"
fix_cmd = "idris2x pin {version}"
fix_note = "If it fails again, stop: there is no flag that skips this check. Follow the runbook below to report the mirror."
auto = "none"
[[case]]
error = "E-SIG-INVALID"
case = "wrong-key"
summary = "channel manifest was signed by an untrusted key"
story = "The channel manifest was signed by a key I do not trust."
facts = "manifest=url signed-by=signer trusted-key=key"
state = "The manifest was discarded. Your lock file and store are unchanged, and everything already pinned still runs."
why = "This URL is not the channel this idris2x trusts, or the channel changed its key after this idris2x was released, or someone is impersonating the channel."
fix_lead = ""
fix_cmd = ""
fix_note = "Check that the manifest URL is the channel you meant. If it is, update idris2x, because key changes ship in launcher releases. Never swap the trusted key by hand."
auto = "none"
[[case]]
error = "E-SIG-INVALID"
case = "malformed"
summary = "cannot read signature material: {what}"
story = "I could not read the signature material: {what}."
facts = "file=file"
state = "The manifest was discarded. Your lock file and store are unchanged, and everything already pinned still runs."
why = "The file is not a signify-format Ed25519 key or signature. A proxy or captive portal that returns a web page in place of the file is the usual cause."
fix_lead = ""
fix_cmd = ""
fix_note = "Open the file named above. If it contains HTML, fix the proxy or network first, then run the same command again."
auto = "none"

[[case]]
error = "E-OFFLINE"
case = "capsule-missing"
summary = "a pinned capsule is not in the store and {mode} is set"
story = "I need a capsule that is not in the store, and offline mode is on."
facts = "capsule=digest store=store offline-because=mode"
state = "Nothing was downloaded, as you asked. The store is unchanged."
why = "Offline mode never touches the network, so the capsule has to arrive another way."
fix_lead = ""
fix_cmd = "idris2x fetch -o capsule.tar.gz"
fix_note = "Run that on a connected machine with the same {lock}, copy capsule.tar.gz here, then run: idris2x install --from capsule.tar.gz"
auto = "none"
[[case]]
error = "E-OFFLINE"
case = "no-manifest"
summary = "no cached channel manifest and {mode} is set"
story = "Pinning needs the channel manifest. None is cached, and offline mode is on."
facts = "cache=cache offline-because=mode"
state = "Nothing was changed."
why = "pin reads the signed channel manifest. Offline, it can only use a copy cached by an earlier online pin."
fix_lead = "Run the pin once with the network allowed:"
fix_cmd = "IDRIS2X_OFFLINE=0 idris2x pin {version}"
fix_note = "Running an already pinned toolchain never needs the manifest: install --locked and exec --locked work offline from the store."
auto = "none"

[[case]]
error = "E-LOCK-TIMEOUT"
case = "held"
summary = "waited {seconds}s for another install of the same capsule"
story = "Another idris2x is installing the same capsule. I waited {seconds} seconds and then gave up."
facts = "capsule=digest lock-file=lockfile held-by=holder"
state = "This run installed nothing. The other install is not affected."
why = "Installs of one capsule take turns, so two processes never write the same store entry. A slow download in the other process is the usual cause."
fix_lead = "Wait for the other install to finish, or allow more time:"
fix_cmd = "IDRIS2X_LOCK_TIMEOUT=1800 idris2x install --locked"
fix_note = "Do not delete the lock file while its holder is running: two installs would then write at once. The lock is released by itself when the holder exits."
auto = "safe"

[[case]]
error = "E-USAGE"
case = "unknown-command"
summary = "no such command: {word}"
story = "I do not know the command {word}."
facts = "you-typed=word commands=commands"
state = "Nothing was run."
why = "The first word after idris2x must be one of the commands listed above."
fix_lead = "See what each command does:"
fix_cmd = "idris2x help"
fix_note = ""
auto = "none"
[[case]]
error = "E-USAGE"
case = "unknown-flag"
summary = "{command} does not take {word}"
story = "The {command} command does not take {word}."
facts = "you-typed=word usage=usage"
state = "Nothing was run."
why = "Each command accepts only the flags shown in its usage line."
fix_lead = ""
fix_cmd = ""
fix_note = "Run the command again in the form shown after usage."
auto = "none"
[[case]]
error = "E-USAGE"
case = "missing-argument"
summary = "{command} needs {what}"
story = "The {command} command needs {what}."
facts = "usage=usage"
state = "Nothing was run."
why = "The command cannot choose this value for you."
fix_lead = ""
fix_cmd = ""
fix_note = "Run the command again in the form shown after usage."
auto = "none"
[[case]]
error = "E-USAGE"
case = "no-such-file"
summary = "no such file: {path}"
story = "I cannot find the file {path}."
facts = "you-gave=path looked-from=dir"
state = "Nothing was installed or changed."
why = "A relative path is read from the current directory."
fix_lead = ""
fix_cmd = ""
fix_note = "Check the spelling, or give the full path."
auto = "none"
[[case]]
error = "E-USAGE"
case = "no-such-id"
summary = "no such error id: {word}"
story = "There is no error called {word}."
facts = "you-typed=word"
state = "Nothing was run."
why = "Error ids are written in capitals and start with E-, exactly as a message prints them."
fix_lead = "List every id:"
fix_cmd = "idris2x explain"
fix_note = ""
auto = "safe"
[[case]]
error = "E-USAGE"
case = "prototype-setting"
summary = "{variable} is not set"
story = "The prototype needs {variable} to be set."
facts = "missing=variable holds=what"
state = "Nothing was run."
why = "The bash prototype reads its channel address and trusted key from the environment. The real launcher will have both built in."
fix_lead = ""
fix_cmd = ""
fix_note = "Set {variable} and run the command again. See scripts/proto/chaos.sh for a working example."
auto = "none"

[[case]]
error = "E-PLATFORM-UNSUPPORTED"
case = "unknown-arch"
summary = "no capsules are built for the {arch} processor type"
story = "No capsules are built for this machine's processor type, {arch}."
facts = "this-machine=arch supported=supported"
state = "Nothing was downloaded or changed."
why = "Each capsule holds programs compiled for one processor type and operating system, and none has been built for this pair."
fix_lead = ""
fix_cmd = ""
fix_note = "See the supported platforms page for the list and for how to ask for a new target. Building Idris 2 from source remains possible without idris2x."
auto = "none"
[[case]]
error = "E-PLATFORM-UNSUPPORTED"
case = "unknown-os"
summary = "no capsules are built for the {os} operating system"
story = "No capsules are built for this operating system, {os}."
facts = "this-machine=os supported=supported"
state = "Nothing was downloaded or changed."
why = "Each capsule holds programs compiled for one processor type and operating system, and none has been built for this pair."
fix_lead = ""
fix_cmd = ""
fix_note = "See the supported platforms page for the list and for how to ask for a new target. Building Idris 2 from source remains possible without idris2x."
auto = "none"

[[case]]
error = "E-NETWORK"
case = "all-mirrors-failed"
summary = "every mirror failed for the pinned capsule"
story = "I could not download the pinned capsule from any mirror."
facts = "capsule=digest tried=tried full-log=log"
state = "Nothing was installed. The store is unchanged."
why = "Each address in the lock was tried in turn and each one failed for the reason shown after it."
fix_lead = "When the network is back, run it again:"
fix_cmd = "idris2x install --locked"
fix_note = "If you are behind a proxy, check that HTTPS_PROXY is set. If every mirror answers 404, the capsule was withdrawn: see the runbook below."
auto = "safe"
[[case]]
error = "E-NETWORK"
case = "manifest-unreachable"
summary = "cannot fetch the channel manifest"
story = "I could not fetch the channel manifest."
facts = "manifest=url tried=tried full-log=log"
state = "The lock file was not changed. Everything already pinned still runs."
why = "pin needs a fresh copy of the signed manifest, and the address above did not provide one."
fix_lead = "When the network is back, run it again:"
fix_cmd = "idris2x pin {version}"
fix_note = "Running an already pinned toolchain does not need the network once its capsule is installed."
auto = "safe"

[[case]]
error = "E-GLIBC-FLOOR"
case = "too-old"
summary = "this system has glibc {host} and the capsule needs {needs} or newer"
story = "This system's C library is too old for the pinned capsule."
facts = "this-system=host capsule-needs=needs capsule=digest"
state = "Nothing was downloaded or changed."
why = "The capsule's programs were built against glibc {needs}. On an older glibc they would fail to start, with a less clear message than this one."
fix_lead = ""
fix_cmd = ""
fix_note = "Run this project in a newer distribution or container image, one with glibc {needs} or newer. This check cannot be skipped."
auto = "none"

[[case]]
error = "E-PROBE-CODEGEN"
case = "chez-failed"
summary = "Chez Scheme from the capsule does not run here"
story = "The capsule's Chez Scheme did not run correctly on this machine."
facts = "check=probe chez-said=output"
state = "The capsule was not installed. The store is unchanged."
why = "The capsule's files are intact, since the checksums passed, so something about this machine stops the program running: a missing system library, a security policy, or an unsupported processor."
fix_lead = "Collect the facts for a report:"
fix_cmd = "idris2x doctor"
fix_note = "The line after chez-said is Chez Scheme's own message, not ours. Send it with the doctor output using the runbook below."
auto = "safe"
[[case]]
error = "E-PROBE-CODEGEN"
case = "idris2-failed"
summary = "Idris 2 from the capsule does not start here"
story = "The capsule's Idris 2 did not start on this machine."
facts = "check=probe idris2-said=output"
state = "The capsule was not installed. The store is unchanged."
why = "Chez Scheme runs, so the fault is in starting the compiler itself: usually its support library could not be loaded."
fix_lead = "Collect the facts for a report:"
fix_cmd = "idris2x doctor"
fix_note = "The line after idris2-said is Idris 2's own message, not ours. Report this to idris2x, not to the Idris 2 project: the fault is in how the capsule was built or run."
auto = "safe"
[[case]]
error = "E-PROBE-CODEGEN"
case = "version-mismatch"
summary = "the capsule's Idris 2 reports {got}, not {want}"
story = "The capsule says it holds Idris 2 {want}, and the compiler inside reports something else."
facts = "capsule-says=want compiler-reports=got"
state = "The capsule was not installed. The store is unchanged."
why = "The capsule was labelled wrongly when it was built. This is a fault in the capsule, not in your machine."
fix_lead = ""
fix_cmd = ""
fix_note = "Report the capsule using the runbook below. Until it is replaced, pin a different version."
auto = "none"
[[case]]
error = "E-PROBE-CODEGEN"
case = "path-has-spaces"
summary = "compiled programs cannot start because the store path contains a space"
story = "Programs compiled by this toolchain cannot start, because the store path contains a space."
facts = "check=probe store-entry=store"
state = "The capsule is installed and the compiler itself works. Only programs it compiles with the Chez backend are affected."
why = "A compiled program begins with a line naming Chez Scheme by its full path, and the operating system splits that line at spaces."
fix_lead = "Move the store to a path without spaces, then install again:"
fix_cmd = "export IDRIS2X_CACHE=\"$HOME/.cache/idris2x\""
fix_note = "Any directory whose full path has no spaces will do. Programs built with --cg refc are not affected."
auto = "none"
[[case]]
error = "E-PROBE-CODEGEN"
case = "codegen-failed"
summary = "a test program did not compile and run: {probe}"
story = "A small test program did not compile and run with this toolchain."
facts = "check=probe store-entry=store"
state = "The capsule is installed. Nothing else was changed."
why = "The compiler starts, and building or running a program with it fails on this machine."
fix_lead = "Collect the facts for a report:"
fix_cmd = "idris2x doctor"
fix_note = "Send the doctor output using the runbook below."
auto = "safe"

[[case]]
error = "E-CHANNEL-SCHEMA"
case = "lock-newer"
summary = "{file} uses lock format {found}; this idris2x reads up to {supports}"
story = "{file} was written by a newer idris2x than this one."
facts = "file=file its-format=found this-idris2x-reads=supports this-idris2x=version"
state = "Nothing was downloaded or changed. The lock file is intact."
why = "Someone pinned this project with a newer idris2x. An older one refuses to guess at fields it does not know."
fix_lead = ""
fix_cmd = ""
fix_note = "Update idris2x to the version your colleagues use, then run the same command again."
auto = "none"
[[case]]
error = "E-CHANNEL-SCHEMA"
case = "channel-newer"
summary = "the channel uses manifest format {found}; this idris2x reads up to {supports}"
story = "The channel now publishes a newer manifest format than this idris2x reads."
facts = "manifest=url its-format=found this-idris2x-reads=supports this-idris2x=version"
state = "The lock file was not changed. Everything already pinned still runs."
why = "The channel moved to a new format after this idris2x was released."
fix_lead = ""
fix_cmd = ""
fix_note = "Update idris2x, then pin again. Until then, existing pins keep working."
auto = "none"

[[case]]
error = "E-PIN-DRIFT"
case = "toml-vs-lock"
summary = "idris2x.toml asks for idris2 {toml} and idris2x.lock pins {locked}"
story = "idris2x.toml and idris2x.lock name different versions of Idris 2."
facts = "idris2x.toml=toml idris2x.lock=locked"
state = "Nothing was downloaded or changed."
why = "One of the two files was edited without the other. With --locked the lock is never rewritten to match."
fix_lead = "Make the lock match idris2x.toml:"
fix_cmd = "idris2x pin {toml}"
fix_note = "If the lock is the one that is right, change idris2x.toml to {locked} instead."
auto = "none"

[[case]]
error = "E-CAPSULE-INVALID"
case = "unsafe-path"
summary = "the capsule archive has a member that would be written outside the store"
story = "The capsule archive contains a file that would be written outside the store, so I refused to unpack it."
facts = "capsule=digest"
state = "Nothing was unpacked or installed. The archive was deleted."
why = "The archive has an absolute path, a .. component or a link that leaves its own directory. A correctly built capsule never does, so the archive is faulty or hostile."
fix_lead = ""
fix_cmd = ""
fix_note = "Do not unpack it by hand. Report the digest above to idris2x using the runbook below."
auto = "none"
[[case]]
error = "E-CAPSULE-INVALID"
case = "no-metadata"
summary = "the capsule archive has no capsule.json"
story = "The capsule archive has no capsule.json, so I cannot tell what it holds."
facts = "capsule=digest"
state = "Nothing was installed. The unpacked files were deleted."
why = "Every capsule describes itself in capsule.json. This archive matched its digest and is not a capsule, which is a fault in how it was built."
fix_lead = ""
fix_cmd = ""
fix_note = "Report the digest above to idris2x using the runbook below."
auto = "none"
[[case]]
error = "E-CAPSULE-INVALID"
case = "tree-mismatch"
summary = "the capsule's files do not match its own checksum list"
story = "The capsule unpacked, and its files do not match its own checksum list."
facts = "capsule=digest"
state = "Nothing was installed. The unpacked files were deleted."
why = "The archive as a whole matched the lock, so the fault was built into the capsule, or the disk damaged the files while unpacking."
fix_lead = "Try once more, in case the disk was at fault:"
fix_cmd = "idris2x install --locked"
fix_note = "If it fails the same way, report the digest above to idris2x using the runbook below."
auto = "safe"

[[case]]
error = "E-CHANNEL-ROLLBACK"
case = "version-went-back"
summary = "the channel offered manifest version {offered}; this project has already seen {seen}"
story = "The channel offered an older manifest than this project has already seen."
facts = "manifest=url lock-has-seen=seen now-offered=offered"
state = "The lock file was not changed. Everything already pinned still runs."
why = "Manifest versions only go up. An older one usually means a mirror that has not caught up. It can also be an attempt to hide a newer release."
fix_lead = "Wait an hour, then try again:"
fix_cmd = "idris2x pin {version}"
fix_note = "If it is still older tomorrow, report it using the runbook below. There is no flag that accepts an older manifest."
auto = "none"

[[case]]
error = "E-CHANNEL-EXPIRED"
case = "expired"
summary = "the channel manifest expired at {expires}"
story = "The channel manifest is past its expiry time."
facts = "manifest=url expired-at=expires this-clock-says=now"
state = "The lock file was not changed. Everything already pinned still runs."
why = "Manifests are re-signed regularly, so a stale one means a mirror is serving an old copy, the channel is no longer maintained, or this machine's clock is wrong."
fix_lead = "Check the clock line above. If it is right, try again later:"
fix_cmd = "idris2x pin {version}"
fix_note = "To pin from the expired manifest anyway, set IDRIS2X_ALLOW_EXPIRED=1. That gives up protection against being shown an outdated list of releases, so use it only when you know why the manifest is old."
auto = "none"

[[case]]
error = "E-STORE-IO"
case = "cannot-create"
summary = "cannot create {path}"
story = "I could not create a directory the store needs."
facts = "path=path"
state = "Nothing was installed."
why = "The directory's parent is missing, read-only, or owned by another user."
fix_lead = "Either fix the permissions, or put the store somewhere you can write:"
fix_cmd = "export IDRIS2X_CACHE=\"$HOME/.cache/idris2x\""
fix_note = "The store path must not contain spaces if you compile programs with the Chez backend."
auto = "none"
[[case]]
error = "E-STORE-IO"
case = "write-failed"
summary = "writing to the store failed: {detail}"
story = "I could not finish writing to the store."
facts = "while=detail store=path"
state = "Nothing was installed. Partly written files were removed, and existing capsules are untouched."
why = "The disk is full, a quota or file-size limit was reached, or the store became read-only."
fix_lead = "Free some space, for example by removing capsules you no longer use:"
fix_cmd = "idris2x gc"
fix_note = "Then run the same command again."
auto = "none"
[[case]]
error = "E-STORE-IO"
case = "rename-failed"
summary = "cannot move the unpacked capsule into place"
story = "The capsule unpacked correctly, and I could not move it into its place in the store."
facts = "store-entry=path"
state = "Nothing was installed. The unpacked files were removed."
why = "The final step is a single rename, so that a capsule is either complete or absent. The rename fails when the store and its staging area are on different filesystems, or the store is read-only."
fix_lead = ""
fix_cmd = ""
fix_note = "Check that the store directory is on one writable filesystem, then run the same command again."
auto = "none"

[[case]]
error = "E-INTERNAL"
case = "bug"
summary = "internal error: {detail}"
story = "I have hit a bug in idris2x itself."
facts = "what=detail idris2x-version=version"
state = "Unknown. Run idris2x verify to check the installed capsule."
why = "This is a fault in idris2x, not something you did."
fix_lead = "Collect the facts, then open an issue with them:"
fix_cmd = "idris2x doctor"
fix_note = "Attach the doctor output and the command you ran to a new issue at https://github.com/metadatastician/idris2x/issues"
auto = "safe"
[[case]]
error = "E-INTERNAL"
case = "missing-tool"
summary = "the prototype needs {tool} and cannot find it"
story = "The bash prototype needs the program {tool}, and it is not installed."
facts = "missing=tool"
state = "Nothing was run."
why = "The prototype is a shell script that calls ordinary system tools. The real launcher will not need them."
fix_lead = ""
fix_cmd = ""
fix_note = "Install {tool} with your system's package manager, then run the same command again."
auto = "none"

# --- advice: notes that are not errors (doctor, gc). Each carries its own review date: scripts/check-advice-review.sh fails
# once `review_by` has passed, and the reviewer must then renew it with a reason or delete it (`retire_when` says when).
[[advice]]
id = "env-ignored"
text = "{names} is set in your shell and idris2x will ignore it. Pass --inherit-env to keep it."
silence = "IDRIS2X_ADVICE_ENV"
added = "2026-11-16"
review_by = "2027-05-16"
retire_when = "the environment contract (ADR 0005) stops resetting these variables"
basis = "tested: chaos drill T17"
[[advice]]
id = "lsp-mismatch"
text = "idris2-lsp on PATH does not report Idris 2 {pinned}, the version this project pins. Editors may show wrong errors until it is rebuilt for {pinned}."
silence = "IDRIS2X_ADVICE_LSP"
added = "2026-11-16"
review_by = "2027-01-16"
retire_when = "idris2-lsp ships inside capsules, or it is shown that idris2-lsp --version does not print the compiler version"
basis = "unverified: tested against a stand-in program only, never against a real idris2-lsp"
