name: Project labels

# Applies the idris2x project labels from .github/labels-idris2x.toml (create or update, never delete).
# The estate label set stays with labels.yml. Runs only on main or by hand, never on pull requests.
# NO `uses:` (see labels.yml for why). The token reaches git as a masked header, never in a URL.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels-idris2x.toml']

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the commit (plain git, token as a masked header)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0); echo "::add-mask::$auth"
          git init -q src && cd src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Apply project labels
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync-local-labels.sh "$GITHUB_REPOSITORY"
