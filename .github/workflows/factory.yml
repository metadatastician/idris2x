name: Capsule factory

# Builds one capsule (Chez Scheme 10.4.1 + Idris 2 v0.8.0) for each Tier 1 target of src/definitions/targets.toml, proves it
# works on the machine that built it, and attests its build provenance. It signs nothing: the owner signs the channel
# offline (docs/MAINTAINERS.adoc), and no private key lives on GitHub. THIS WORKFLOW HAS NOT RUN ON GITHUB YET.
#
# Each `capsule` job uploads one workflow artifact, `capsule-<triple>`, holding exactly two files:
#   idris2-0.8.0-<triple>-chez10.4.1.tar.gz   the capsule, named as scripts/proto/make-capsule.sh names it
#   <triple>.bundle.json                      {"target","file","sha256","size","min_glibc","chez"}
# scripts/factory/make-channel.sh turns a directory of those records into an UNSIGNED channel manifest. The release
# workflow calls this one with `workflow_call`; it must grant `id-token: write` and `attestations: write` to the call,
# because the `attest` jobs need them.
#
# Toolchains come from upstream source, pinned exactly as chaos.yml pins them, and nothing is patched (zero-fork policy).
# Linux capsules are built inside the manylinux_2_28 image for the arch, pinned by digest (ADR 0006), so the glibc floor is
# 2.28; build-toolchain.sh fails if the measured floor is higher than targets.toml promises.
#
# The `capsule` matrix and the `attest` matrix must list the Tier 1 targets of targets.toml; the first job fails if they do
# not (scripts/factory/check-matrix.sh).
#
# `attest` does not run on pull requests: GitHub gives a pull request from a fork no `id-token`, so it could not attest.
# That skip shows as "skipped" in the run; every other check runs on pull requests.

on:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/factory.yml'
      - 'scripts/factory/**'
      - 'scripts/proto/make-capsule.sh'
      - 'scripts/gen-matrix.sh'
      - 'scripts/lib/toml2json.sh'
      - 'src/definitions/targets.toml'
      - 'tests/canaries/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix-check:
    name: "matrix matches targets.toml"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch the commit (plain git, token as a masked header)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q src && cd src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Compare the matrices with the Tier 1 rows of targets.toml
        working-directory: src
        run: scripts/factory/check-matrix.sh

  capsule:
    name: "capsule (${{ matrix.triple }})"
    needs: matrix-check
    runs-on: ${{ matrix.runner }}
    # Not measured on GitHub yet. chaos.yml builds the same Chez and Idris 2 natively in about 16 minutes on 4 vCPUs; this
    # adds the capsule, the canaries and the container run, so the limit is generous. Replace it with a measured one.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            chez_machine: ta6le
            os: linux
            # quay.io/pypa/manylinux_2_28_x86_64, the digest of the `latest` tag on 2026-11-27 (registry API)
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            chez_machine: tarm64le
            os: linux
            # quay.io/pypa/manylinux_2_28_aarch64, the digest of the `latest` tag on 2026-11-27 (registry API)
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:126d9eea9d6b1717f3e17b2b3ac51da04ef159a5f935dac36fe92d621dc8f246
          - triple: aarch64-apple-darwin
            runner: macos-15
            chez_machine: tarm64osx
            os: macos
            image: ''
          - triple: x86_64-apple-darwin
            # macos-15-intel is listed on docs.github.com/en/actions/reference/runners/github-hosted-runners (2026-11-27).
            # GitHub plans to retire Intel runners (ADR 0010); when this label goes, see the cross-build note in
            # scripts/factory/README.adoc.
            runner: macos-15-intel
            chez_machine: ta6osx
            os: macos
            image: ''
    env:
      TRIPLE: ${{ matrix.triple }}
      MACHINE: ${{ matrix.chez_machine }}
      IMAGE: ${{ matrix.image }}
      CAPSULE_NAME: idris2-0.8.0-${{ matrix.triple }}-chez10.4.1
    steps:
      - name: Fetch the commit (plain git, token as a masked header)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q src && cd src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install packages (Linux host)
        # jq and signify-openbsd: the proof. libgmp-dev: the refc canary links GMP. The toolchain itself is built in the container.
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q jq signify-openbsd libgmp-dev build-essential curl git tar
      - name: Install packages (macOS)
        # gtar: GNU tar for make-capsule.sh. signify-osx: the throwaway key and channel. gmp: the refc canary. UNTESTED on GitHub.
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          command -v jq >/dev/null || brew install jq
          command -v gtar >/dev/null || brew install gnu-tar
          brew install signify-osx gmp
          echo "CPATH=$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"
      - name: Build the launcher and the fixture server (host)
        working-directory: src
        env:
          RUST_VERSION: '1.97.0' # the version release.yml builds the released launcher with
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" build --locked --release --bin idris2x --example fixture_server
      - name: Build Chez Scheme, Idris 2 and the capsule inside the manylinux_2_28 image
        # gmp-devel: Idris 2's refc support library needs gmp.h to build, and the image lacks it. The package comes from
        # the image's own repositories and is not pinned; only the image is (scripts/factory/README.adoc).
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          docker run --rm -e TRIPLE -e MACHINE \
            -v "$GITHUB_WORKSPACE/src:/src:ro" -v "$RUNNER_TEMP/work:/work" "$IMAGE" \
            bash -euo pipefail -c '
              command -v jq >/dev/null || dnf install -y -q jq
              command -v git >/dev/null || dnf install -y -q git-core
              dnf install -y -q gmp-devel
              /src/scripts/factory/build-toolchain.sh --target "$TRIPLE" --machine "$MACHINE" --work /work/build --out /work/out'
      - name: Build Chez Scheme, Idris 2 and the capsule (macOS, native)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          src/scripts/factory/build-toolchain.sh --target "$TRIPLE" --machine "$MACHINE" --work "$RUNNER_TEMP/work/build" --out "$RUNNER_TEMP/work/out"
      - name: Canaries inside the manylinux_2_28 image (the glibc 2.28 floor, run for real)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          docker run --rm -e CAPSULE_NAME \
            -v "$GITHUB_WORKSPACE/src:/src:ro" -v "$RUNNER_TEMP/work/out:/out:ro" "$IMAGE" \
            bash -euo pipefail -c '
              dnf install -y -q jq gmp-devel
              ldd --version | sed -n 1p
              mkdir /tmp/cap && tar -xzf "/out/$CAPSULE_NAME.tar.gz" -C /tmp/cap
              /src/scripts/factory/run-canaries.sh /tmp/cap'
      - name: Install through the launcher from a throwaway-signed local channel, then canaries and selftest
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/work/out"
          src/scripts/factory/prove-capsule.sh --capsule "$out/$CAPSULE_NAME.tar.gz" --bundle "$out/$TRIPLE.bundle.json" \
            --launcher src/target/release/idris2x --fixture src/target/release/examples/fixture_server \
            --work "$RUNNER_TEMP/prove" --port 8199
      - name: Check that the artifact is exactly the capsule and its bundle record
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work/out"
          want=$(printf '%s\n%s\n' "$CAPSULE_NAME.tar.gz" "$TRIPLE.bundle.json" | sort)
          have=$(find . -maxdepth 1 -type f | sed 's|^\./||' | sort)
          if [ "$want" != "$have" ]; then echo "::error::the out directory holds [$have], expected [$want]"; exit 1; fi
          jq -e --arg t "$TRIPLE" --arg f "$CAPSULE_NAME.tar.gz" '.target == $t and .file == $f' "$TRIPLE.bundle.json" >/dev/null
          cat "$TRIPLE.bundle.json"
      - name: Upload the capsule and its bundle record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-${{ matrix.triple }}
          path: |
            ${{ runner.temp }}/work/out/idris2-0.8.0-${{ matrix.triple }}-chez10.4.1.tar.gz
            ${{ runner.temp }}/work/out/${{ matrix.triple }}.bundle.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: "attest (${{ matrix.triple }})"
    needs: capsule
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job may mint the OIDC token and write the attestation. It runs no build code, only a checksum.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        triple:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Download the capsule artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capsule-${{ matrix.triple }}
          path: capsule
      - name: Check the bundle record against the tarball before attesting it
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          cd capsule
          file=$(jq -r .file "$TRIPLE.bundle.json")
          [ -f "$file" ] || { echo "::error::$file is not in the artifact"; exit 1; }
          got=$(sha256sum "$file" | cut -d' ' -f1)
          want=$(jq -r .sha256 "$TRIPLE.bundle.json")
          if [ "$got" != "$want" ]; then echo "::error::$file sha256 is $got, the bundle record says $want"; exit 1; fi
          echo "$got  $file"
      - name: Attest build provenance of the capsule
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: capsule/*.tar.gz
