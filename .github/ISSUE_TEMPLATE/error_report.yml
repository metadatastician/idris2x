# GENERATED by scripts/gen-issue-forms.sh from src/errors/errors.toml — edit the TOML, not this file.
name: idris2x printed an error
description: idris2x stopped with an error ID (E-...). Start here; it is the fastest way to a fix.
title: "[E-???] <one line: what you ran and what happened>"
labels: ["bug", "needs-triage", "error-report"]
body:
  - type: markdown
    attributes:
      value: |
        Every idris2x failure has a stable ID, an exit code and a runbook. Please check the runbook linked in the
        error first: most reports are solved by its fix line. If it did not help, this form gives us everything
        we need in one round trip.
  - type: dropdown
    id: error-id
    attributes:
      label: Error ID
      description: The E-... code idris2x printed (also its exit code).
      options:
        - "E-USAGE (exit 2): bad command line"
        - "E-PIN-NOT-FOUND (exit 10): no lock, or lock/channel has no capsule for this version+target"
        - "E-HASH-MISMATCH (exit 11): downloaded bytes or unpacked tree do not match the pinned digest"
        - "E-SIG-INVALID (exit 12): channel manifest signature or key id does not verify"
        - "E-PLATFORM-UNSUPPORTED (exit 13): no capsule exists for this OS/arch"
        - "E-NETWORK (exit 14): all mirrors failed"
        - "E-LOCK-TIMEOUT (exit 15): another install of the same capsule held the lock too long"
        - "E-GLIBC-FLOOR (exit 16): host glibc older than the capsule's min_glibc"
        - "E-PROBE-CODEGEN (exit 17): capsule unpacked and verified but a canary failed on this host"
        - "E-CHANNEL-SCHEMA (exit 18): channel or lock schema newer than this launcher"
        - "E-PIN-DRIFT (exit 19): idris2x.toml and idris2x.lock disagree"
        - "E-OFFLINE (exit 20): cache miss while IDRIS2X_OFFLINE=1"
        - "E-CAPSULE-INVALID (exit 21): capsule archive is malformed or contains unsafe paths/links"
        - "E-CHANNEL-ROLLBACK (exit 22): channel_version went backwards relative to the lock (rollback/freeze attack or stale mirror)"
        - "E-CHANNEL-EXPIRED (exit 23): channel manifest past its expires timestamp (freeze protection)"
        - "E-STORE-IO (exit 24): store not writable, disk full, or atomic rename failed"
        - "E-OUTPUT (exit 25): standard output is full, or the program reading it stopped"
        - "E-INTERNAL (exit 70): launcher bug"
        - "No error ID was printed (that itself is a bug: every failure must be typed)"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command and its full output
      render: shell
      placeholder: |
        $ idris2x exec --locked -- idris2 --check src/Main.idr
        idris2x: E-HASH-MISMATCH: ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of idris2x doctor --json
      description: Contains no secrets and no telemetry; review it before pasting if you are unsure.
      render: json
    validations:
      required: true
  - type: textarea
    id: lock
    attributes:
      label: idris2x.lock (if the project has one)
      render: json
  - type: dropdown
    id: context
    attributes:
      label: Where did this happen?
      options: ["Developer laptop", "CI runner (GitHub-hosted)", "CI runner (self-hosted)", "Server or container", "Air-gapped host", "Other"]
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I read the runbook linked in the error message.
          required: true
        - label: I did not paste any credentials, tokens or private paths I mind sharing.
          required: true
